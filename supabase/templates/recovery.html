<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Cyan 비밀번호 재설정</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f4f4f4; color: #111111; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f4f4; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; overflow: hidden; border: 1px solid #d8d8d8; border-radius: 8px; background: #ffffff;">
            <tr>
              <td style="padding: 28px 28px 20px; border-bottom: 1px solid #e8e8e8;">
                <p style="margin: 0 0 8px; color: #666666; font-size: 13px; font-weight: 700;">Project Cyan</p>
                <h1 style="margin: 0; color: #111111; font-size: 24px; line-height: 1.35;">비밀번호 재설정 안내</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px;">
                <p style="margin: 0 0 16px; color: #333333; font-size: 15px; line-height: 1.7;">
                  안녕하세요. Project Cyan 계정의 비밀번호 재설정을 요청하셨습니다.
                </p>
                <p style="margin: 0 0 24px; color: #333333; font-size: 15px; line-height: 1.7;">
                  아래 버튼을 눌러 새 비밀번호를 설정해주세요. 직접 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다.
                </p>
                <p style="margin: 0 0 24px; text-align: center;">
                  <a href="{{ .ConfirmationURL }}" style="display: inline-block; min-width: 180px; padding: 14px 22px; border-radius: 999px; background: #111111; color: #ffffff; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none;">비밀번호 재설정</a>
                </p>
                <p style="margin: 0; color: #777777; font-size: 12px; line-height: 1.6;">
                  버튼이 열리지 않으면 아래 링크를 브라우저 주소창에 붙여넣어 주세요.<br>
                  <a href="{{ .ConfirmationURL }}" style="color: #333333; word-break: break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
