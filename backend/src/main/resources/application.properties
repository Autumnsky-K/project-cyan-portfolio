spring.application.name=project-cyan

spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:20000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

admin.auth.username=${ADMIN_AUTH_USERNAME:}
admin.auth.password=${ADMIN_AUTH_PASSWORD:}

supabase.storage.project-url=${SUPABASE_PROJECT_URL:}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.auth.project-url=${SUPABASE_PROJECT_URL:}
supabase.auth.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER:}
supabase.jwt.jwks-url=${SUPABASE_JWKS_URL:}
supabase.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}

project-cyan.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
project-cyan.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
project-cyan.password-reset.from=${PASSWORD_RESET_FROM:}

toss.payments.secret-key=${TOSS_PAYMENTS_SECRET_KEY:}

project-cyan.ai-catalog.enabled=${AI_GOODS_CATALOG_EXPORT_ENABLED:false}
project-cyan.ai-catalog.bucket=${AI_GOODS_CATALOG_BUCKET:ai-catalog}
project-cyan.ai-catalog.path=${AI_GOODS_CATALOG_PATH:}
project-cyan.ai-catalog.latest-file-name=${AI_GOODS_CATALOG_FILE_NAME:goods-catalog-latest.tsv}
project-cyan.ai-catalog.cron=${AI_GOODS_CATALOG_CRON:0 */5 * * * *}
project-cyan.ai-catalog.zone=${AI_GOODS_CATALOG_ZONE:Asia/Seoul}
project-cyan.ai-catalog.signed-url-ttl-seconds=${AI_GOODS_CATALOG_SIGNED_URL_TTL_SECONDS:604800}
project-cyan.ai-service.base-url=${PROJECT_CYAN_AI_SERVICE_URL:http://127.0.0.1:8000}
project-cyan.ai-service.internal-token=${PROJECT_CYAN_INTERNAL_SERVICE_TOKEN:}
project-cyan.ai-credentials.master-key=${PROJECT_CYAN_CREDENTIAL_MASTER_KEY:}
project-cyan.ai-credentials.allowed-hosts=${PROJECT_CYAN_LLM_ALLOWED_HOSTS:api.openai.com,api.anthropic.com,chatgpt.com}
