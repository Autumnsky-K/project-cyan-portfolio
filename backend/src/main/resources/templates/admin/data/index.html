<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터 관리 지도</title>
  <link rel="stylesheet" th:href="@{/admin/goods-admin.css(v='sidebar-rail-tuned-20260626')}">
</head>
<body>
<main class="admin-page">
  <aside th:replace="~{admin/fragments/sidebar :: sidebar('data-overview', 'admin-sidebar', 'admin-eyebrow', '관리자')}"></aside>

  <section class="admin-main">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">데이터 관리</p>
        <h2>데이터 관리 지도</h2>
      </div>
    </header>

    <section class="admin-data-grid" aria-label="데이터 관리 영역">
      <article class="admin-data-card" th:each="area : ${dataAreas}">
        <div>
          <strong th:text="${area.title()}">굿즈 데이터</strong>
          <p th:text="${area.description()}">굿즈명, 가격, 태그</p>
        </div>
        <footer>
          <span th:text="${area.status()}">관리 가능</span>
          <a th:if="${area.href() != null and !area.href().isBlank()}" th:href="${area.href()}">관리하기</a>
        </footer>
      </article>
    </section>
  </section>
</main>
</body>
</html>
