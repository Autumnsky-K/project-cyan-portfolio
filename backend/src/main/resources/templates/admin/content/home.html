<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈 화면 내용 편집</title>
  <link rel="stylesheet" th:href="@{/admin/goods-admin.css}">
  <link rel="stylesheet" th:href="@{/admin/content-admin.css}">
</head>
<body>
<main class="admin-page"
      data-cms-page="home"
      th:attr="data-cms-storage-public-base-url=${cmsStoragePublicBaseUrl}">
  <aside th:replace="~{admin/fragments/sidebar :: sidebar('content-home', 'admin-sidebar', 'admin-eyebrow', '관리자')}"></aside>

  <section class="admin-main">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">실시간 미리보기 관리</p>
        <h2>홈 화면 내용 편집</h2>
      </div>
      <div class="admin-header-actions">
        <button class="admin-primary admin-apply-page-button" type="submit" form="homeContentForm">홈 화면 적용</button>
        <a th:href="@{/}">스토어 열기</a>
      </div>
    </header>

    <div class="admin-notice" th:if="${notice}" th:text="${notice}"></div>

    <section class="cms-workbench">
      <form id="homeContentForm"
            class="cms-sheet-panel"
            method="post"
            th:action="@{/admin/content/home}"
            data-confirm-submit
            data-confirm-form-title="홈 화면">
        <div class="cms-panel-heading">
          <h3>문구·이미지 입력</h3>
        </div>
        <input type="hidden" name="primaryColor" data-preview-input="primaryColor" th:value="${page.primaryColor()}">
        <input type="hidden" name="accentColor" data-preview-input="accentColor" th:value="${page.accentColor()}">
        <input type="hidden" name="backgroundColor" data-preview-input="backgroundColor" th:value="${page.backgroundColor()}">

        <table class="cms-sheet">
          <thead>
          <tr>
            <th>항목</th>
            <th>입력</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <th>상단 보조 문구</th>
            <td><input name="eyebrow" data-preview-input="eyebrow" data-confirm-group="문구" data-confirm-label="상단 보조 문구" th:value="${page.eyebrow()}" th:data-fallback-value="${page.eyebrow()}" th:placeholder="${page.eyebrow()}"></td>
          </tr>
          <tr>
            <th>제목</th>
            <td><input name="title" data-preview-input="title" data-confirm-group="문구" data-confirm-label="제목" th:value="${page.title()}" th:data-fallback-value="${page.title()}" th:placeholder="${page.title()}"></td>
          </tr>
          <tr>
            <th>섹션 제목</th>
            <td><input name="summaryTitle" data-preview-input="summaryTitle" data-confirm-group="문구" data-confirm-label="섹션 제목" th:value="${page.summaryTitle()}" th:data-fallback-value="${page.summaryTitle()}" th:placeholder="${page.summaryTitle()}"></td>
          </tr>
          <tr>
            <th>섹션 설명</th>
            <td><input name="summaryBody" data-preview-input="summaryBody" data-confirm-group="문구" data-confirm-label="섹션 설명" th:value="${page.summaryBody()}" th:data-fallback-value="${page.summaryBody()}" th:placeholder="${page.summaryBody()}"></td>
          </tr>
          <tr>
            <th>헤더 이미지</th>
            <td>
              <input name="heroImageUrl" data-preview-input="heroImageUrl" data-confirm-group="이미지" data-confirm-label="헤더 이미지" th:value="${page.heroImageUrl()}" th:data-fallback-value="${page.heroImageUrl()}" th:placeholder="${page.heroImageUrl() ?: '현재 이미지 없음'}">
              <input class="cms-file-input" type="file" accept="image/*" data-image-target="heroImageUrl">
            </td>
          </tr>
          </tbody>
        </table>
      </form>

      <section class="cms-preview-panel" aria-label="홈 화면 미리보기">
        <div class="cms-panel-heading">
          <h3>실시간 미리보기</h3>
          <span>적용 전</span>
        </div>
        <iframe id="cmsPreview" title="홈 화면 실시간 미리보기"></iframe>
      </section>
    </section>
  </section>
</main>
<script th:src="@{/admin/content-admin.js}"></script>
</body>
</html>
