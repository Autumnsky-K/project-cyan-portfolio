<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>굿즈 정보 관리</title>
  <link rel="stylesheet" th:href="@{/admin/goods-admin.css(v='sidebar-rail-tuned-20260626')}">
</head>
<body>
<main class="admin-page">
  <aside th:replace="~{admin/fragments/sidebar :: sidebar('goods', 'admin-sidebar', 'admin-eyebrow', '관리자')}"></aside>

  <section class="admin-main">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">상품 데이터 관리</p>
        <h2>굿즈 정보 관리</h2>
      </div>
      <div class="admin-header-actions">
        <a th:href="${frontendGoodsBaseUrl}" target="_blank" rel="noreferrer">굿즈 화면 열기</a>
        <a class="admin-primary" th:href="@{/admin/goods/new}">굿즈 등록</a>
      </div>
    </header>

    <div class="admin-notice" th:if="${notice}" th:text="${notice}"></div>
    <div class="admin-notice admin-notice-error" th:if="${error}" th:text="${error}"></div>

    <section class="admin-stats" aria-label="굿즈 현황">
      <article>
        <span>전체 굿즈</span>
        <strong th:text="${goodsPage.totalElements()}">0</strong>
      </article>
      <article>
        <span>현재 페이지</span>
        <strong th:text="${goodsPage.totalPages() > 0 ? goodsPage.page() + 1 : 0}">0</strong>
      </article>
      <article>
        <span>표시 행 수</span>
        <strong th:text="${#lists.size(goodsPage.content())}">0</strong>
      </article>
    </section>

    <form class="admin-toolbar" method="get" th:action="@{/admin/goods}" aria-label="굿즈 필터" data-goods-filter-form>
      <label>
        <span>검색</span>
        <input type="search" name="q" placeholder="굿즈명 검색" th:value="${q}">
      </label>
      <label>
        <span>아티스트</span>
        <select name="artistId">
          <option value="">전체 아티스트</option>
          <option th:each="artist : ${filters.artists()}"
                  th:value="${artist.value()}"
                  th:text="${artist.label()}"
                  th:selected="${artistId != null and artist.value() == artistId.toString()}"></option>
        </select>
      </label>
      <label>
        <span>카테고리</span>
        <select name="categoryId">
          <option value="">전체 카테고리</option>
          <option th:each="category : ${filters.categories()}"
                  th:value="${category.value()}"
                  th:text="${category.label()}"
                  th:selected="${categoryId != null and category.value() == categoryId.toString()}"></option>
        </select>
      </label>
      <label>
        <span>판매 상태</span>
        <select name="salesStatus">
          <option value="">전체 상태</option>
          <option th:each="status : ${salesStatuses}"
                  th:value="${status}"
                  th:text="${salesStatusLabels.get(status) ?: status}"
                  th:selected="${salesStatus == status}"></option>
        </select>
      </label>
      <input type="hidden" name="sort" value="createdAt,desc">
      <button class="admin-toolbar-search-button" type="submit">검색</button>
    </form>

    <form class="admin-bulk-form"
          method="post"
          th:action="@{/admin/goods/bulk}"
          data-goods-bulk-form>
      <input type="hidden" name="q" th:value="${q}">
      <input type="hidden" name="artistId" th:value="${artistId}">
      <input type="hidden" name="categoryId" th:value="${categoryId}">
      <input type="hidden" name="filterSalesStatus" th:value="${salesStatus}">
      <input type="hidden" name="sort" th:value="${sort}">
      <input type="hidden" name="page" th:value="${goodsPage.page()}">
      <section class="admin-bulk-toolbar" aria-label="굿즈 일괄 수정 도구">
        <div class="admin-bulk-selection">
          <label class="admin-bulk-check-label">
            <input type="checkbox" data-goods-bulk-master>
            <span class="admin-bulk-check-text">
              <span>현재 페이지</span>
              <span>전체 선택</span>
            </span>
          </label>
          <span class="admin-bulk-count"><span data-goods-bulk-count>0</span>개 선택</span>
        </div>

        <div class="admin-bulk-field-tools">
          <div class="admin-bulk-tool-pair">
            <label>
              <span>아티스트 일괄 편집</span>
              <select data-goods-bulk-choice="artist">
                <option value="">아티스트 없음</option>
                <option th:each="artist : ${filters.artists()}"
                        th:value="${artist.value()}"
                        th:text="${artist.label()}"></option>
              </select>
            </label>
            <button type="button" data-goods-bulk-apply-choice="artist">적용</button>
          </div>
          <div class="admin-bulk-tool-pair">
            <label>
              <span>카테고리 일괄 편집</span>
              <select data-goods-bulk-choice="category">
                <option value="">카테고리 없음</option>
                <option th:each="category : ${filters.categories()}"
                        th:value="${category.value()}"
                        th:text="${category.label()}"></option>
              </select>
            </label>
            <button type="button" data-goods-bulk-apply-choice="category">적용</button>
          </div>
          <div class="admin-bulk-tool-pair">
            <label>
              <span>판매 상태 일괄 편집</span>
              <select data-goods-bulk-choice="status">
                <option value="">판매 상태 선택</option>
                <option th:each="status : ${salesStatuses}"
                        th:value="${status}"
                        th:text="${salesStatusLabels.get(status) ?: status}"></option>
              </select>
            </label>
            <button type="button" data-goods-bulk-apply-choice="status">적용</button>
          </div>
          <div class="admin-bulk-tool-pair">
            <label>
              <span>태그 일괄 편집</span>
              <input type="text" data-goods-bulk-tags placeholder="#태그 #태그">
            </label>
            <button type="button" data-goods-bulk-apply-tags>적용</button>
          </div>
        </div>

        <button class="admin-primary admin-bulk-submit" type="submit" data-goods-bulk-submit>선택 상품 변경사항 저장</button>
      </section>

      <section class="admin-table-panel" aria-label="굿즈 일괄 수정 표">
        <div class="admin-state" th:if="${#lists.isEmpty(bulkRows)}">조건에 맞는 굿즈가 없습니다.</div>

        <div class="admin-table-scroll" th:if="${!#lists.isEmpty(bulkRows)}">
          <table class="admin-goods-table admin-bulk-table">
            <thead>
            <tr>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'createdAt,desc' or sort == 'createdAt,asc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'createdAt,desc' ? 'createdAt,asc' : 'createdAt,desc'},page=0)}">
                  <span>등록순</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'createdAt,asc' ? '▲' : (sort == 'createdAt,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>썸네일</th>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'goodsName,asc' or sort == 'goodsName,desc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'goodsName,asc' ? 'goodsName,desc' : 'goodsName,asc'},page=0)}">
                  <span>이름</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'goodsName,asc' ? '▲' : (sort == 'goodsName,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'price,asc' or sort == 'price,desc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'price,asc' ? 'price,desc' : 'price,asc'},page=0)}">
                  <span>가격</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'price,asc' ? '▲' : (sort == 'price,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'artist.artistName,asc' or sort == 'artist.artistName,desc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'artist.artistName,asc' ? 'artist.artistName,desc' : 'artist.artistName,asc'},page=0)}">
                  <span>아티스트</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'artist.artistName,asc' ? '▲' : (sort == 'artist.artistName,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'category.categoryName,asc' or sort == 'category.categoryName,desc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'category.categoryName,asc' ? 'category.categoryName,desc' : 'category.categoryName,asc'},page=0)}">
                  <span>카테고리</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'category.categoryName,asc' ? '▲' : (sort == 'category.categoryName,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>
                <a class="admin-sort-link"
                   th:classappend="${sort == 'salesStatus,asc' or sort == 'salesStatus,desc'} ? ' is-active'"
                   th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort == 'salesStatus,asc' ? 'salesStatus,desc' : 'salesStatus,asc'},page=0)}">
                  <span>판매 상태</span>
                  <span class="admin-sort-mark"
                        th:text="${sort == 'salesStatus,asc' ? '▲' : (sort == 'salesStatus,desc' ? '▼' : '')}"></span>
                </a>
              </th>
              <th>재고</th>
              <th>태그</th>
              <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr class="admin-bulk-row"
                th:each="row : ${bulkRows}"
                th:classappend="${defaultGoodsChecked} ? ' is-selected'"
                th:attr="data-goods-id=${row.goodsId()}">
              <td class="admin-bulk-select-cell">
                <input class="admin-bulk-checkbox"
                       type="checkbox"
                       name="selectedGoodsId"
                       th:value="${row.goodsId()}"
                       th:checked="${defaultGoodsChecked}">
                <input type="hidden" name="goodsId" th:value="${row.goodsId()}">
                <input type="hidden" name="imageUrl" th:value="${row.imageUrl()}">
                <a class="admin-bulk-id-link"
                   th:href="@{/admin/goods/{goodsId}/edit(goodsId=${row.goodsId()})}"
                   th:text="'#' + ${row.goodsId()}">#0</a>
              </td>
              <td>
                <div class="admin-thumb" th:aria-label="${row.name()} + ' 이미지'">
                  <img th:if="${row.imageUrl()}" th:src="${row.imageUrl()}" alt="">
                  <span th:if="${row.imageUrl() == null or row.imageUrl().isBlank()}"
                        th:text="${row.categoryLabel()}">굿즈</span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell">
                  <input class="admin-bulk-input"
                         type="text"
                         name="name"
                         required
                         th:value="${row.name()}"
                         th:attr="data-original=${row.name()},data-original-label=${row.name()}">
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell admin-bulk-number">
                  <input class="admin-bulk-input"
                         type="number"
                         name="price"
                         min="0"
                         required
                         th:value="${row.price()}"
                         th:attr="data-original=${row.price()},data-original-label=${row.price()}">
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell">
                  <select class="admin-bulk-input admin-bulk-choice-input"
                          name="rowArtistId"
                          data-choice-kind="artist"
                          th:attr="data-original=${row.artistId() == null ? '' : row.artistId()},data-original-label=${row.artistLabel()}">
                    <option value="" th:selected="${row.artistId() == null}">아티스트 없음</option>
                    <option th:each="artist : ${filters.artists()}"
                            th:value="${artist.value()}"
                            th:text="${artist.label()}"
                            th:selected="${row.artistId() != null and artist.value() == row.artistId().toString()}"></option>
                  </select>
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell">
                  <select class="admin-bulk-input admin-bulk-choice-input"
                          name="rowCategoryId"
                          data-choice-kind="category"
                          th:attr="data-original=${row.categoryId() == null ? '' : row.categoryId()},data-original-label=${row.categoryLabel()}">
                    <option value="" th:selected="${row.categoryId() == null}">카테고리 없음</option>
                    <option th:each="category : ${filters.categories()}"
                            th:value="${category.value()}"
                            th:text="${category.label()}"
                            th:selected="${row.categoryId() != null and category.value() == row.categoryId().toString()}"></option>
                  </select>
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell">
                  <select class="admin-bulk-input admin-bulk-choice-input"
                          name="salesStatus"
                          data-choice-kind="status"
                          th:attr="data-original=${row.salesStatus()},data-original-label=${row.salesStatusLabel()}">
                    <option th:each="status : ${salesStatuses}"
                            th:value="${status}"
                            th:text="${salesStatusLabels.get(status) ?: status}"
                            th:selected="${status == row.salesStatus()}"></option>
                  </select>
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell admin-bulk-number">
                  <input class="admin-bulk-input"
                         type="number"
                         name="stockCount"
                         min="0"
                         th:value="${row.stockCount()}"
                         th:attr="data-original=${row.stockCount()},data-original-label=${row.stockCount()}">
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-bulk-cell admin-bulk-tags">
                  <input class="admin-bulk-input"
                         type="text"
                         name="tagsText"
                         placeholder="#태그 #태그"
                         th:value="${row.tagsText()}"
                         th:attr="data-original=${row.tagsText()},data-original-label=${row.tagsText().isBlank() ? '비어 있음' : row.tagsText()}">
                  <span class="admin-bulk-original" data-original-preview hidden></span>
                </div>
              </td>
              <td>
                <div class="admin-actions admin-bulk-actions">
                  <a th:href="${frontendGoodsBaseUrl + '/' + row.goodsId()}" target="_blank" rel="noreferrer">보기</a>
                  <a th:href="@{/admin/goods/{goodsId}/edit(goodsId=${row.goodsId()})}">상세</a>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>
    </form>

    <nav class="admin-pagination" th:if="${goodsPage.totalPages() > 0}" aria-label="굿즈 페이지 이동">
      <a th:classappend="${goodsPage.page() <= 0} ? ' is-disabled'"
         th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort},page=${goodsPage.page() - 1})}">이전</a>
      <div class="admin-page-list">
        <a th:each="pageNumber : ${pageNumbers}"
           th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort},page=${pageNumber})}"
           th:aria-current="${pageNumber == goodsPage.page()} ? 'page'"
           th:text="${pageNumber + 1}">1</a>
      </div>
      <a th:classappend="${goodsPage.page() >= goodsPage.totalPages() - 1} ? ' is-disabled'"
         th:href="@{/admin/goods(q=${q},artistId=${artistId},categoryId=${categoryId},salesStatus=${salesStatus},sort=${sort},page=${goodsPage.page() + 1})}">다음</a>
      <span th:text="${(goodsPage.page() + 1) + ' / ' + goodsPage.totalPages() + ' 페이지'}">1 / 1 페이지</span>
    </nav>
  </section>
</main>
<script th:src="@{/admin/goods-bulk.js}"></script>
</body>
</html>
