<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 저장소 관리</title>
  <link rel="stylesheet" th:href="@{/admin/goods-admin.css(v='storage-directory-index-20260701')}">
</head>
<body>
<main class="admin-page">
  <aside th:replace="~{admin/fragments/sidebar :: sidebar('storage', 'admin-sidebar', 'admin-eyebrow', '관리자')}"></aside>

  <section class="admin-main">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">Supabase 이미지 저장소</p>
        <h2>이미지 저장소 관리</h2>
      </div>
    </header>

    <div class="admin-notice" th:if="${notice}" th:text="${notice}"></div>
    <div class="admin-notice admin-notice-error" th:if="${storageError}" th:text="${storageError}"></div>
    <div class="admin-notice admin-notice-error" th:if="${goodsImageError}" th:text="${goodsImageError}"></div>

    <section class="admin-storage-library admin-storage-directory"
             data-storage-upload
             th:attr="data-upload-endpoint=@{/admin/storage/uploads}">
      <div class="admin-upload-header">
        <div>
          <p class="admin-eyebrow">버킷 디렉토리</p>
          <h3>Supabase 저장소 (이미지)</h3>
        </div>
        <div class="admin-storage-header-actions">
          <form method="post" th:action="@{/admin/storage/directories/sync}">
            <button type="submit">Supabase 동기화</button>
          </form>
        </div>
      </div>

      <div class="admin-upload-status admin-storage-upload-status">
        <strong data-upload-status-title>대기 중</strong>
        <span data-upload-status-meta>트리에서 Bucket 또는 폴더를 선택한 뒤 이미지 폴더를 업로드하세요.</span>
      </div>

      <div class="admin-upload-controls">
        <label>
          <span>Bucket</span>
          <select data-upload-bucket required>
            <option value="">Bucket 선택</option>
            <option th:each="bucket : ${buckets}"
                    th:value="${bucket.name()}"
                    th:text="${bucket.name()}"
                    th:selected="${bucket.name() == goodsImageBucket}">goods-image</option>
          </select>
        </label>
        <label>
          <span>Path</span>
          <select data-upload-path required>
            <option value="">Path 선택</option>
            <option th:each="pathOption : ${storagePathOptions}"
                    th:value="${pathOption.bucketName() + '/' + pathOption.path()}"
                    th:text="${pathOption.path()}"
                    th:attr="data-bucket=${pathOption.bucketName()},data-path=${pathOption.path()}"
                    th:selected="${pathOption.bucketName() == goodsImageBucket and pathOption.path() == goodsImagePath}">goods</option>
          </select>
        </label>
      </div>

      <input class="admin-upload-hidden-file"
             type="file"
             data-upload-files
             accept="image/*"
             webkitdirectory
             directory
             multiple>

      <div class="admin-upload-progress" aria-hidden="true">
        <span data-upload-progress-bar></span>
      </div>

      <div class="admin-form-actions">
        <button class="admin-primary" type="button" data-upload-start disabled>업로드 시작</button>
        <button type="button" data-upload-cancel disabled>취소</button>
      </div>

      <ul class="admin-upload-queue" data-upload-queue></ul>

      <div class="admin-storage-directory-hint">
        <button type="button" data-image-tree-expand="#storageImageTree">전체 펼치기</button>
        <button type="button" data-image-tree-collapse="#storageImageTree">전체 접기</button>
      </div>

      <div id="storageImageTree"
           class="admin-image-tree admin-storage-directory-tree"
           data-storage-image-library
           data-image-tree
           data-empty-label="등록된 Bucket 또는 이미지가 없습니다."
           th:attr="data-image-tree-lazy-endpoint=@{/admin/storage/images}"
           data-root-label="Supabase 저장소 (이미지)">
        <div data-image-tree-root></div>
        <div data-image-tree-source hidden>
          <span th:each="directory : ${storageDirectories}"
                th:attr="data-image-tree-folder-path=${directory.treePath()},
                         data-image-tree-folder-count=${directory.imageCount()},
                         data-image-tree-folder-last=${directory.lastFileName()},
                         data-image-tree-other-summary=${directory.otherExtensionSummary()},
                         data-image-tree-other-last=${directory.lastOtherFileName()}"></span>
        </div>
      </div>
    </section>

    <form class="admin-form" method="post" th:object="${pathForm}" th:action="@{/admin/storage/paths}">
      <div>
        <p class="admin-eyebrow">Path 생성</p>
        <p class="admin-control-help">새 업로드 위치가 필요할 때만 Path를 추가하세요.</p>
      </div>
      <section class="admin-form-grid">
        <label>
          <span>Bucket</span>
          <select id="pathBucketName" name="bucketName" required>
            <option value="">Bucket 선택</option>
            <option th:each="bucket : ${buckets}"
                    th:value="${bucket.name()}"
                    th:text="${bucket.name()}"
                    th:selected="${pathForm.bucketName != null and bucket.name() == pathForm.bucketName}"></option>
          </select>
          <small th:if="${#fields.hasErrors('bucketName')}" th:errors="*{bucketName}"></small>
        </label>

        <label>
          <span>Path</span>
          <input type="text" th:field="*{path}" placeholder="goods/genshin_impact" required>
          <small th:if="${#fields.hasErrors('path')}" th:errors="*{path}"></small>
        </label>
      </section>

      <div class="admin-form-actions">
        <button class="admin-primary" type="submit">Path 생성</button>
      </div>
    </form>

    <form class="admin-form admin-bucket-create-form" method="post" th:object="${bucketForm}" th:action="@{/admin/storage/buckets}">
      <div>
        <p class="admin-eyebrow">Bucket 생성</p>
        <p class="admin-control-help">새 이미지 저장소가 필요할 때만 Bucket을 추가하세요.</p>
      </div>
      <section class="admin-form-grid">
        <label>
          <span>Bucket 이름</span>
          <input id="bucketCreateName"
                 type="text"
                 th:field="*{bucketName}"
                 placeholder="image-assets"
                 required>
          <small th:if="${#fields.hasErrors('bucketName')}" th:errors="*{bucketName}"></small>
        </label>

        <label class="admin-check-label">
          <span>접근 권한</span>
          <span class="admin-check-inline">
            <input type="checkbox" th:field="*{publicBucket}">
            <span>공개 Bucket</span>
          </span>
        </label>
      </section>

      <div class="admin-form-actions">
        <button class="admin-primary" type="submit">Bucket 생성</button>
      </div>
    </form>
  </section>
</main>
<script th:src="@{/admin/image-library-tree.js(v='storage-extension-summary-20260701')}"></script>
<script th:src="@{/admin/image-webp-compressor.js(v='webp-upload-20260701')}"></script>
<script th:src="@{/admin/storage-admin.js(v='webp-upload-20260701')}"></script>
</body>
</html>
