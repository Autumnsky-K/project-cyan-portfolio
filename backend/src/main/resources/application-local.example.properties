spring.application.name=project-cyan

spring.datasource.url=jdbc:postgresql://127.0.0.1:54322/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

supabase.storage.project-url=http://127.0.0.1:54321
supabase.storage.service-role-key=<SERVICE_ROLE_KEY from supabase status -o env>
supabase.auth.project-url=http://127.0.0.1:54321
supabase.auth.service-role-key=<SERVICE_ROLE_KEY from supabase status -o env>
supabase.jwt.issuer=http://127.0.0.1:54321/auth/v1
supabase.jwt.jwks-url=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
supabase.jwt.audience=authenticated

toss.payments.secret-key=<TOSS_PAYMENTS_SECRET_KEY>

project-cyan.ai-catalog.enabled=false
project-cyan.ai-catalog.bucket=ai-catalog
project-cyan.ai-catalog.path=
project-cyan.ai-catalog.latest-file-name=goods-catalog-latest.tsv
project-cyan.ai-catalog.cron=0 */5 * * * *
project-cyan.ai-catalog.zone=Asia/Seoul
project-cyan.ai-catalog.signed-url-ttl-seconds=604800
