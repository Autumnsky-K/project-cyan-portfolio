spring.application.name=project-cyan

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:20000}
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

supabase.storage.project-url=${SUPABASE_PROJECT_URL}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.auth.project-url=${SUPABASE_PROJECT_URL}
supabase.auth.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER}
supabase.jwt.jwks-url=${SUPABASE_JWKS_URL}
supabase.jwt.audience=authenticated

project-cyan.password-reset.frontend-base-url=http://localhost:5173
project-cyan.password-reset.token-ttl=30m
project-cyan.password-reset.from=

# Configure these or equivalent environment variables before testing real email delivery.
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=<SMTP_USERNAME>
# spring.mail.password=<SMTP_PASSWORD>
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

toss.payments.secret-key=<TOSS_PAYMENTS_SECRET_KEY>

project-cyan.ai-catalog.enabled=false
project-cyan.ai-catalog.bucket=ai-catalog
project-cyan.ai-catalog.path=
project-cyan.ai-catalog.latest-file-name=goods-catalog-latest.tsv
project-cyan.ai-catalog.cron=0 */5 * * * *
project-cyan.ai-catalog.zone=Asia/Seoul
project-cyan.ai-catalog.signed-url-ttl-seconds=604800
project-cyan.ai-service.base-url=http://127.0.0.1:8000
project-cyan.ai-service.internal-token=
project-cyan.ai-credentials.master-key=
project-cyan.ai-credentials.allowed-hosts=api.openai.com,api.anthropic.com,chatgpt.com
